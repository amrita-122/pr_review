[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Github PR review agent"
readme = "README.md"
authors = [
    { name = "Amrita", email = "amritasood59@gmail.com" }
]

requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]          # lets tests import `app` from the repo root
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # errors, pyflakes, imports, bugbear, modern syntax, security

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]       # assert is fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
