name: "Evals"

# Runs the reviewer on the golden set with the real model and fails the PR if quality drops
# below evals/thresholds.json. Only runs when something that can change review quality changes.
on:
  pull_request:
    paths:
      - "app/review/**"
      - "evals/**"
      - "!evals/holdout/**"  # the held-out set is run by hand, never gated in CI
      - ".github/workflows/evals.yml"

# Read-only token. Never switch this to pull_request_target: that would hand the API key to
# code from forks.
permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    # Fork PRs get no secrets, so skip them instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Settings requires these, but the eval runner never uses them. Placeholders only.
      GITHUB_APP_ID: "0"
      GITHUB_WEBHOOK_SECRET: "unused"
      GITHUB_PRIVATE_KEY_BASE64: "unused"
      DATABASE_URL: "sqlite://"
      MODEL_REVIEW: "claude-sonnet-5-5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run evals (3 runs, gated by evals/thresholds.json)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m evals.run --runs 3 --check --max-cost 3
      - name: Run the red-team set (3 runs, gated by the "redteam" thresholds)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m evals.run --suite redteam --label ci --runs 3 --check --max-cost 3
      # Architecture agent gate (10.26). OFF until a maintainer sets the repository variable
      # ARCH_EVAL_ENABLED=true (Settings > Secrets and variables > Actions > Variables), after the
      # measured numbers and a cost limit are in evals/thresholds.json ("architecture").
      - name: Run the architecture agent evals (3 runs, gated by the "architecture" thresholds)
        if: ${{ vars.ARCH_EVAL_ENABLED == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m evals.architecture_run --confirm-spend --runs 3 --check --max-cost 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
